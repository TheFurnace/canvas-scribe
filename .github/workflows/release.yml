name: Publish plugin release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

concurrency:
  group: publish-plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Verify version metadata
        id: version
        run: |
          node scripts/check-versions.mjs
          version="$(node -p "require('./manifest.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version." >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require stable releases to come from main
        if: steps.version.outputs.prerelease == 'false'
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Stable releases must be tagged from a commit contained in main." >&2
            exit 1
          fi
      - name: Use the tagged release source
        id: release-source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git checkout --detach "refs/tags/$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check for existing release
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existing-release.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.existing-release.outputs.exists == 'false'
        run: pnpm build
        env:
          CANVAS_SCRIBE_BUILD_ID: release-${{ steps.version.outputs.version }}-${{ steps.release-source.outputs.sha }}
      - if: steps.existing-release.outputs.exists == 'false'
        run: pnpm test
      - name: Create install archive
        if: steps.existing-release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: zip "canvas-scribe-${VERSION}.zip" main.js manifest.json styles.css
      - name: Publish GitHub release for BRAT
        if: steps.existing-release.outputs.exists == 'false'
        run: |
          release_flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$VERSION" \
            main.js manifest.json styles.css "canvas-scribe-${VERSION}.zip" \
            --verify-tag --generate-notes --title "Canvas Scribe $VERSION" \
            "${release_flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
