name: Verify plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          CANVAS_SCRIBE_BUILD_ID: ci-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-scribe-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
